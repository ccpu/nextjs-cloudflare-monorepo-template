    typescript: ^6.0.3

  lint:
    '@pixpilot/eslint-config': ^3.1.0
    '@pixpilot/eslint-config-next': ^1.0.1
    '@pixpilot/eslint-config-react': ^0.10.2
    eslint: ^10.13.0
    eslint-plugin-turbo: ^2.11.10

  format:
    prettier: ^3.9.10

  git:
