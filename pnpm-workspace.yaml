    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0

  next:
    next: 16.3.7
    '@opennextjs/cloudflare': ^1.20.14
    next-sitemap: ^4.2.3
    next-themes: ^0.4.6
    '@pixpilot/next-security-headers': ^0.3.2

  cloudflare:
    '@cloudflare/workers-types': ^5.20261030.1
    wrangler: ^4.156.0

  env:
    '@pixpilot/env': ^1.4.0
    '@pixpilot/next-env': ^0.4.2

  validation:
    zod: 4.6.5

  testing:
    '@pixpilot/next-test-utils': ^1.1.2
    '@testing-library/dom': ^10.4.2
    '@testing-library/jest-dom': ^6.9.1
    '@testing-library/react': 16.3.0
    '@vitest/coverage-v8': ^3.2.7
    '@vitest/ui': ^3.2.7
